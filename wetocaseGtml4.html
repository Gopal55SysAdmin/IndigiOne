        textarea {
            height: 90px;
            resize: vertical;
        }
        .recaptcha-wrapper {
            margin-top: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

            padding: 12px;
            background-color: #0070d2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: #005bb5;
        }
    </style>
</head>
