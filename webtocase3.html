<!DOCTYPE html>
<html>
<head>
    <title>Support</title>
</head>
<body>
    <h3>Submit a Case</h3>
    
    <form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00DWs00000MhTZx" method="POST">
        
        <input type="hidden" name="captcha_settings" value='{"keyname":"GitPage","fallback":"true","orgId":"00DWs00000MhTZx","ts":""}'>
        <input type="hidden" name="orgid" value="00DWs00000MhTZx">
        <input type="hidden" name="retURL" value="https://gopal55sysadmin.github.io/IndigiOne/webtocase3.html">
        
        Name: <input name="name" type="text"><br><br>
        Email: <input name="email" type="text"><br><br>
        Subject: <input name="subject" type="text"><br><br>
        Description: <textarea name="description"></textarea><br><br>
        
        <script src="https://www.google.com/recaptcha/api.js"></script>
        <div class="g-recaptcha" data-sitekey="6Lc0mNksAAAAAJo6kLJxcCW_694onvNVBNJfoYaJ"></div><br><br>
        
        <input type="submit" name="submit" value="Submit">
    </form>

    <script>
        setInterval(function() {
            var r = document.getElementById("g-recaptcha-response");
            if (!r || r.value.trim() == "") {
                var e = JSON.parse(document.getElementsByName("captcha_settings")[0].value);
                e.ts = JSON.stringify(new Date().getTime());
                document.getElementsByName("captcha_settings")[0].value = JSON.stringify(e);
            }
        }, 500);
    </script>
</body>
</html>
