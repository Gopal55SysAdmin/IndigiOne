<!DOCTYPE html>
<html>
<head>
    <title>Support</title>
    <style>
        /* Dark background for the whole page */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Deep black/gray */
            display: flex;
            justify-content: center;
            padding: 30px 10px;
            margin: 0;
            color: #e0e0e0; /* Light text for dark mode */
        }

        /* The form card in a slightly lighter black to stand out */
        form {
            background: #1e1e1e; /* Dark surface color */
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6); /* Stronger shadow for dark mode */
            width: 100%;
            max-width: 400px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Purple title */
        h3 {
            text-align: center;
            color: #bb86fc; /* Bright, modern purple */
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* Input boxes styled for dark mode */
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #2c2c2c; /* Dark input fields */
            color: #ffffff; /* White text when typing */
            border: 1px solid #444444; /* Subtle dark border */
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        /* Changes the input border to purple when clicked/typing */
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #8a2be2;
        }

        /* The purple submit button */
        input[type="submit"] {
            background-color: #8a2be2; /* Vibrant purple */
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        input[type="submit"]:hover {
            background-color: #6a0dad; /* Darker purple on hover */
        }
    </style>
</head>
<body>
    
    <form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00DWs00000MhTZx" method="POST">
        <h3>Submit a Case</h3>
        
        <input type="hidden" name="captcha_settings" value='{"keyname":"GitPage","fallback":"true","orgId":"00DWs00000MhTZx","ts":""}'>
        <input type="hidden" name="orgid" value="00DWs00000MhTZx">
        <input type="hidden" name="retURL" value="https://gopal55sysadmin.github.io/IndigiOne/webtocase3.html">
        
        Name: <input name="name" type="text"><br><br>
        Email: <input name="email" type="text"><br><br>
        Subject: <input name="subject" type="text"><br><br>
        Description: <textarea name="description"></textarea><br><br>
        
        <script src="https://www.google.com/recaptcha/api.js"></script>
        <div class="g-recaptcha" data-sitekey="6Lc0mNksAAAAAJo6kLJxcCW_694onvNVBNJfoYaJ"></div><br><br>
        
        <input type="submit" name="submit" value="Submit">
    </form>

    <script>
        setInterval(function() {
            var r = document.getElementById("g-recaptcha-response");
            if (!r || r.value.trim() == "") {
                var e = JSON.parse(document.getElementsByName("captcha_settings")[0].value);
                e.ts = JSON.stringify(new Date().getTime());
                document.getElementsByName("captcha_settings")[0].value = JSON.stringify(e);
            }
        }, 500);
    </script>
</body>
</html>
